<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 - 세종마켓 중고거래</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="mypage.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a class="nav-logo" href="../main_ui/index.html" id="mypageLogoLink">
        <img src="logo.png" alt="세종마켓 로고" class="nav-logo-img" onerror="this.style.display='none'">
        <span class="nav-logo-text">세종마켓 중고거래</span>
      </a>
      <ul class="nav-links">
        <li><a href="../main_ui/index.html" id="mypageNavHome">홈</a></li>
        <li><a href="../main_ui/product-list.html" id="mypageNavProducts">중고거래</a></li>
        <li><a href="../product_create_ui/product-create-ui.html" id="mypageNavRegister">상품등록</a></li>
        <li><a href="mypage.html" class="nav-active" id="mypageNavMypage">마이페이지</a></li>
        <li class="nav-auth-item" id="authArea"></li>
      </ul>
    </div>
  </nav>

  <main class="mypage-layout">
    <aside class="profile-panel">
      <div class="profile-avatar">
        <i class="ti ti-user"></i>
      </div>

      <p class="profile-nickname" id="profileNickname">불러오는 중</p>
      <p class="profile-dept" id="profileDept">세종대학교 중고거래</p>

      <div class="profile-info-list">
        <div class="profile-info-row">
          <i class="ti ti-mail"></i>
          <span id="profileEmail">-</span>
        </div>
        <div class="profile-info-row">
          <i class="ti ti-id-badge"></i>
          <span id="profileStudentId">-</span>
        </div>
      </div>

      <div class="profile-stats">
        <div class="stat-item">
          <span class="stat-num" id="statProducts">0</span>
          <span class="stat-label">등록 상품</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-num" id="statWishlist">0</span>
          <span class="stat-label">찜한 상품</span>
        </div>
      </div>

      <button class="edit-btn" type="button" id="toggleEditProfileBtn">
        <i class="ti ti-pencil"></i> 정보 수정
      </button>

      <div class="profile-edit-panel" id="profileEditPanel" hidden>
        <form class="profile-edit-form" id="nicknameEditForm">
          <label for="nicknameInput">닉네임</label>
          <div class="edit-input-row">
            <input type="text" id="nicknameInput" placeholder="닉네임을 입력해 주세요.">
            <button type="submit">저장</button>
          </div>
        </form>

        <form class="profile-edit-form" id="passwordEditForm">
          <label for="currentPasswordInput">비밀번호 변경</label>
          <input type="password" id="currentPasswordInput" placeholder="현재 비밀번호">
          <input type="password" id="newPasswordInput" placeholder="새 비밀번호">
          <input type="password" id="newPasswordConfirmInput" placeholder="새 비밀번호 확인">
          <button type="submit" class="password-save-btn">비밀번호 수정</button>
        </form>
      </div>
    </aside>

    <div class="mypage-content">
    <section class="products-panel">
      <div class="panel-header">
        <h2 class="panel-title">내가 등록한 상품</h2>
        <a href="../product_create_ui/product-create-ui.html" class="register-btn" id="mypageRegisterBtn">
          <i class="ti ti-plus"></i> 상품 등록
        </a>
      </div>

      <div class="product-list" id="productList"></div>

      <div class="empty-state" id="emptyState" style="display:none;">
        <i class="ti ti-box-off"></i>
        <p id="emptyStateMessage">아직 등록한 상품이 없습니다.</p>
        <a href="../product_create_ui/product-create-ui.html" class="empty-register-btn" id="mypageEmptyRegisterBtn">
          <i class="ti ti-plus"></i> 첫 상품 등록하기
        </a>
      </div>
    </section>

    <section class="products-panel" id="liked-products">
      <div class="panel-header">
        <h2 class="panel-title">찜한 상품</h2>
      </div>

      <div class="product-list" id="likedProductList"></div>

      <div class="empty-state" id="likedEmptyState" style="display:none;">
        <i class="ti ti-heart-off"></i>
        <p>아직 찜한 상품이 없습니다.</p>
      </div>
    </section>
    </div>
  </main>

  <script src="../common/api-config.js"></script>
  <script src="../common/app-utils.js"></script>
  <script>
    window.SejongMarketUtils.renderAuthArea("authArea", {
      loginUrl: window.SejongMarketUtils.pageUrl('login'),
      signupUrl: window.SejongMarketUtils.pageUrl('login'),
      mypageUrl: window.SejongMarketUtils.pageUrl('mypage'),
      afterLogoutUrl: window.SejongMarketUtils.pageUrl('home')
    });

    // 배포/로컬 환경에 맞게 링크 동적 설정
    (function initMypageLinks() {
      const utils = window.SejongMarketUtils;
      if (!utils) return;

      const logoLink = document.getElementById('mypageLogoLink');
      if (logoLink) logoLink.href = utils.pageUrl('home');

      const navHome = document.getElementById('mypageNavHome');
      if (navHome) navHome.href = utils.pageUrl('home');

      const navProducts = document.getElementById('mypageNavProducts');
      if (navProducts) navProducts.href = utils.pageUrl('products');

      const navRegister = document.getElementById('mypageNavRegister');
      if (navRegister) navRegister.href = utils.pageUrl('productNew');

      const navMypage = document.getElementById('mypageNavMypage');
      if (navMypage) navMypage.href = utils.pageUrl('mypage');

      const registerBtn = document.getElementById('mypageRegisterBtn');
      if (registerBtn) registerBtn.href = utils.pageUrl('productNew');

      const emptyRegisterBtn = document.getElementById('mypageEmptyRegisterBtn');
      if (emptyRegisterBtn) emptyRegisterBtn.href = utils.pageUrl('productNew');
    })();
  </script>
  <script src="mypage.js"></script>
</body>
</html>
