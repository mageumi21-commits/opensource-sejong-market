<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 - 세종마켓 중고거래</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="mypage.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a class="nav-logo" href="../main_ui/index.html">
        <img src="logo.png" alt="세종마켓 로고" class="nav-logo-img" onerror="this.style.display='none'">
        <span class="nav-logo-text">세종마켓 중고거래</span>
      </a>
      <ul class="nav-links">
        <li><a href="../main_ui/index.html">홈</a></li>
        <li><a href="../main_ui/product-list.html">중고거래</a></li>
        <li><a href="../product_create_ui/product-create-ui.html">상품등록</a></li>
        <li><a href="mypage.html" class="nav-active">마이페이지</a></li>
      </ul>
    </div>
  </nav>

  <main class="mypage-layout">
    <aside class="profile-panel">
      <div class="profile-avatar">
        <i class="ti ti-user"></i>
      </div>

      <p class="profile-nickname" id="profileNickname">불러오는 중</p>
      <p class="profile-dept" id="profileDept">세종대학교 중고거래</p>

      <div class="profile-info-list">
        <div class="profile-info-row">
          <i class="ti ti-mail"></i>
          <span id="profileEmail">-</span>
        </div>
        <div class="profile-info-row">
          <i class="ti ti-id-badge"></i>
          <span id="profileStudentId">-</span>
        </div>
      </div>

      <div class="profile-stats">
        <div class="stat-item">
          <span class="stat-num" id="statProducts">0</span>
          <span class="stat-label">등록 상품</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-num" id="statWishlist">0</span>
          <span class="stat-label">찜한 상품</span>
        </div>
      </div>

      <button class="edit-btn" onclick="alert('정보 수정 기능은 준비 중입니다.')">
        <i class="ti ti-pencil"></i> 정보 수정
      </button>
    </aside>

    <section class="products-panel">
      <div class="panel-header">
        <h2 class="panel-title">내가 등록한 상품</h2>
        <a href="../product_create_ui/product-create-ui.html" class="register-btn">
          <i class="ti ti-plus"></i> 상품 등록
        </a>
      </div>

      <div class="product-list" id="productList"></div>

      <div class="empty-state" id="emptyState" style="display:none;">
        <i class="ti ti-box-off"></i>
        <p id="emptyStateMessage">아직 등록한 상품이 없습니다.</p>
        <a href="../product_create_ui/product-create-ui.html" class="empty-register-btn">
          <i class="ti ti-plus"></i> 첫 상품 등록하기
        </a>
      </div>
    </section>
  </main>

  <script src="../common/app-utils.js"></script>
  <script src="mypage.js"></script>
</body>
</html>
