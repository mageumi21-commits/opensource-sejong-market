<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>세종마켓 상품 목록</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        --primary: #d93025;
        --primary-dark: #b71c1c;
        --primary-light: #fdecec;
        --text-primary: #1a1a1a;
        --text-secondary: #555;
        --text-muted: #999;
        --border: #e0e0e0;
        --bg-page: #ffffff;
        --bg-soft: #f7f8fa;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, "Noto Sans KR", sans-serif;
        background: var(--bg-page);
        color: var(--text-primary);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        border: none;
        background: none;
        cursor: pointer;
        font-family: inherit;
      }

      .top-banner {
        width: 100%;
        height: 48px;
        background: linear-gradient(90deg, var(--primary-dark), var(--primary));
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 700;
        position: relative;
      }

      .top-banner span {
        margin-right: 8px;
      }

      .top-banner .close-btn {
        position: absolute;
        right: 28px;
        top: 50%;
        transform: translateY(-50%);
        color: white;
        font-size: 28px;
        font-weight: 300;
      }

      .header {
        border-bottom: 1px solid #eee;
        background: white;
      }

      .header-inner {
        width: 1180px;
        margin: 0 auto;
        padding: 18px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-img {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        object-fit: cover;
      }

      .logo-text-wrap {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }

      .logo-main {
        font-size: 24px;
        font-weight: 900;
      }

      .logo-sub {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-secondary);
      }

      .search-form {
        width: 520px;
        height: 42px;
        background: #f5f5f5;
        border-radius: 999px;
        display: flex;
        align-items: center;
        padding: 0 8px 0 18px;
        gap: 10px;
      }

      .search-icon {
        font-size: 18px;
        color: #999;
      }

      .search-form input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-size: 14px;
      }

      .search-submit-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--primary);
        color: white;
        font-size: 18px;
        font-weight: 900;
      }

      .auth-area {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      .auth-user-name {
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 900;
        white-space: nowrap;
      }

      .login-btn,
      .auth-login-btn,
      .auth-action-btn {
        border: 1px solid var(--primary);
        padding: 13px 25px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 800;
        background: var(--primary);
        color: white;
        transition: 0.18s;
      }

      .auth-action-btn {
        padding: 12px 16px;
      }

      .auth-logout-btn {
        border-color: #d5d5d5;
        background: #ffffff;
        color: var(--text-primary);
      }

      .login-btn:hover,
      .auth-login-btn:hover,
      .auth-action-btn:hover {
        background: var(--primary-dark);
      }

      .auth-logout-btn:hover {
        border-color: var(--primary);
        background: var(--primary-light);
        color: var(--primary);
      }

      .nav {
        width: 1180px;
        height: 70px;
        margin: 0 auto;
        display: flex;
        align-items: center;
      }

      .nav-left {
        display: flex;
        align-items: center;
        gap: 34px;
      }

      .nav-left a {
        font-size: 17px;
        font-weight: 800;
        transition: 0.18s;
      }

      .nav-left a:hover,
      .nav-left a.active {
        color: var(--primary);
      }

      .main {
        width: 1180px;
        margin: 34px auto 80px;
      }

      .list-title {
        font-size: 31px;
        font-weight: 900;
        letter-spacing: -1px;
        margin-bottom: 30px;
      }

      .list-layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 36px;
        align-items: flex-start;
      }

      .filter-sidebar {
        position: sticky;
        top: 20px;
        padding-right: 20px;
      }

      .filter-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .filter-title {
        font-size: 20px;
        font-weight: 900;
      }

      .filter-reset {
        font-size: 13px;
        font-weight: 800;
        color: var(--primary);
      }

      .filter-group {
        padding: 24px 0;
        border-top: 1px solid #eee;
      }

      .filter-group-title {
        font-size: 16px;
        font-weight: 900;
        margin-bottom: 15px;
      }

      .filter-option {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 14px;
        font-size: 15px;
        font-weight: 700;
        color: #444;
        cursor: pointer;
      }

      .filter-option input {
        display: none;
      }

      .custom-radio {
        width: 20px;
        height: 20px;
        border: 1px solid #d8dde2;
        border-radius: 50%;
        background: white;
        position: relative;
      }

      .filter-option input:checked + .custom-radio {
        border-color: var(--primary);
      }

      .filter-option input:checked + .custom-radio::after {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--primary);
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .result-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .result-count {
        font-size: 14px;
        font-weight: 800;
        color: #666;
      }

      .result-sort {
        font-size: 14px;
        font-weight: 800;
        color: #666;
        border: 1px solid #ddd;
        border-radius: 999px;
        padding: 8px 13px;
        background: white;
        outline: none;
      }

      .result-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px 18px;
      }

      .product-card {
        border-radius: 10px;
        overflow: hidden;
        background: white;
        border: 1px solid #eee;
        transition: 0.2s;
        position: relative;
        cursor: pointer;
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .product-img {
        height: 190px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        background: #f1f1f1;
      }

      .product-img.blue {
        background: linear-gradient(135deg, #d8ecff, #ffffff);
      }

      .product-img.gray {
        background: linear-gradient(135deg, #ddd, #f9f9f9);
      }

      .product-img.beige {
        background: linear-gradient(135deg, #d8c7a7, #f5f0e5);
      }

      .product-img.red {
        background: linear-gradient(135deg, var(--primary-light), #ffffff);
      }

      .product-img.green {
        background: linear-gradient(135deg, #e6f8df, #ffffff);
      }

      .product-img.pink {
        background: linear-gradient(135deg, #fff0f3, #ffffff);
      }

      .product-real-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .heart {
        position: absolute;
        right: 12px;
        top: 10px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.86);
        color: white;
        font-size: 27px;
        text-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
        z-index: 5;
        display: grid;
        place-items: center;
        line-height: 1;
      }

      .heart.liked {
        color: var(--primary);
        text-shadow: none;
      }

      .care {
        position: absolute;
        left: 10px;
        top: 10px;
        background: var(--primary);
        color: white;
        padding: 4px 8px;
        border-radius: 3px;
        font-size: 12px;
        font-weight: 900;
        z-index: 5;
      }

      .product-info {
        padding: 13px;
      }

      .product-name {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 9px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .product-status {
        position: absolute;
        left: 10px;
        bottom: 10px;
        z-index: 6;
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 900;
      }

      .product-status.on-sale {
        background: var(--primary);
        color: #fff;
      }

      .product-status.sold-out {
        background: #888;
        color: #fff;
      }

      .product-price {
        font-size: 18px;
        font-weight: 900;
        margin-bottom: 8px;
      }

      .product-meta {
        font-size: 12px;
        color: #777;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      .empty-message {
        grid-column: 1 / -1;
        padding: 55px 20px;
        text-align: center;
        border: 1px dashed #ddd;
        border-radius: 12px;
        color: #777;
        font-size: 15px;
        font-weight: 700;
        background: #fafafa;
      }

      .empty-message.loading {
        color: #777;
      }

      .empty-message.error {
        color: var(--primary);
        background: #fff5f5;
        border-color: #ffd6d6;
      }

      @media (max-width: 1280px) {
        .header-inner,
        .nav,
        .main {
          width: 95%;
        }
      }

      @media (max-width: 900px) {
        .header-inner {
          flex-wrap: wrap;
          gap: 15px;
        }
        .search-form {
          order: 3;
          width: 100%;
        }
        .nav {
          height: auto;
          padding: 18px 0;
          overflow-x: auto;
        }
        .nav-left {
          gap: 22px;
          white-space: nowrap;
        }
        .list-layout {
          grid-template-columns: 1fr;
        }
        .filter-sidebar {
          position: static;
          padding-right: 0;
        }
        .filter-group {
          padding: 18px 0;
        }
        .result-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 520px) {
        .result-grid {
          grid-template-columns: 1fr;
        }
        .list-title {
          font-size: 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="top-banner">
      <span> 🏫 </span>
      세종대학교 학생들을 위한 안전한 중고거래 플랫폼, 세종마켓!
      <button class="close-btn" onclick="closeBanner()">×</button>
    </div>
    <header class="header">
      <div class="header-inner">
        <a href="index.html" class="logo">
          <img src="../login_mypage/logo.png" alt="세종마켓 로고" class="logo-img" />
          <div class="logo-text-wrap">
            <span class="logo-main"> 세종마켓 </span>
            <span class="logo-sub"> 세종대학교 중고거래 </span>
          </div>
        </a>
        <form class="search-form" id="searchForm">
          <span class="search-icon"> ⌕ </span>
          <input id="searchInput" type="text" placeholder="상품명을 검색해주세요" />
          <button type="submit" class="search-submit-btn">›</button>
        </form>
        <div class="auth-area" id="authArea">
          <button
            class="login-btn"
            type="button"
            onclick="location.href = '../login_mypage/login.html'"
          >
            로그인/회원가입
          </button>
        </div>
      </div>
      <nav class="nav">
        <div class="nav-left" id="productListNavLinks"></div>
      </nav>
    </header>
    <main class="main">
      <h1 class="list-title" id="listTitle">전체 상품</h1>
      <div class="list-layout">
        <aside class="filter-sidebar">
          <div class="filter-title-row">
            <h2 class="filter-title">필터</h2>
            <button class="filter-reset" onclick="resetFilter()">초기화</button>
          </div>
          <div class="filter-group">
            <h3 class="filter-group-title">카테고리</h3>
            <label class="filter-option">
              <input type="radio" name="categoryFilter" value="전체" checked />
              <span class="custom-radio"> </span> 전체
            </label>
            <label class="filter-option">
              <input type="radio" name="categoryFilter" value="전자기기" />
              <span class="custom-radio"> </span> 전자기기
            </label>
            <label class="filter-option">
              <input type="radio" name="categoryFilter" value="도서" />
              <span class="custom-radio"> </span> 도서
            </label>
            <label class="filter-option">
              <input type="radio" name="categoryFilter" value="의류" />
              <span class="custom-radio"> </span> 의류
            </label>
            <label class="filter-option">
              <input type="radio" name="categoryFilter" value="생활용품" />
              <span class="custom-radio"> </span> 생활용품
            </label>
            <label class="filter-option">
              <input type="radio" name="categoryFilter" value="기타" />
              <span class="custom-radio"> </span> 기타
            </label>
          </div>
        </aside>
        <section>
          <div class="result-top">
            <p class="result-count" id="resultCount">상품 0개</p>
            <select class="result-sort" id="sortSelect">
              <option value="latest">최신순</option>
              <option value="priceLow">낮은 가격순</option>
              <option value="priceHigh">높은 가격순</option>
            </select>
          </div>
          <div class="result-grid" id="resultGrid">
            <div class="empty-message">상품을 불러오는 중입니다.</div>
          </div>
        </section>
      </div>
    </main>
    <script src="../common/api-config.js"></script>
    <script src="../common/app-utils.js"></script>
    <script>
      window.SejongMarketUtils.renderAuthArea("authArea", {
        loginUrl: window.SejongMarketUtils.pageUrl("login"),
        signupUrl: window.SejongMarketUtils.pageUrl("login"),
        mypageUrl: window.SejongMarketUtils.pageUrl("mypage"),
        afterLogoutUrl: window.SejongMarketUtils.pageUrl("products"),
      });
      
       /*
      ========================= 백엔드 개발자는 여기서 연결하세요 =========================

      이 파일(product-list.html)이 실제 검색/카테고리 목록을 처리하는 페이지입니다.
      - 검색: product-list.html?keyword=맥북
      - 카테고리: product-list.html?category=전자기기
      
      백엔드에서 처리해야 하는 API 예시:
      - GET /api/products
      - GET /api/products?keyword=맥북&category=전자기기
      - GET /api/products?sort=latest
      - GET /api/products?type=recommend
      */
      const {
        API_BASE_URL,
        getLoginEmail,
        toSejongEmail,
        readErrorMessage,
        imageSourceAttributes,
        hydrateRemoteImages,
        pageUrl,
        productDetailUrl,
      } = window.SejongMarketUtils;

      const API_URLS = {
        productList: `${API_BASE_URL}/api/products`,
        imageBaseUrl: API_BASE_URL,
      };

      const fallbackProducts = [
        {
          id: 1,
          name: "맥북 노트북 판매합니다",
          price: 650000,
          category: "전자기기",
          locationName: "세종대 학생회관",
          createdAtText: "방금 전",
          imageUrl: "",
          badgeText: "",
          liked: false,
        },
        {
          id: 2,
          name: "초록색 후리스 상태 좋아요",
          price: 35000,
          category: "의류",
          locationName: "군자역 근처",
          createdAtText: "3분 전",
          imageUrl: "",
          badgeText: "",
          liked: false,
        },
        {
          id: 3,
          name: "에어팟 거의 새상품",
          price: 85000,
          category: "전자기기",
          locationName: "대양AI센터",
          createdAtText: "10분 전",
          imageUrl: "",
          badgeText: "",
          liked: false,
        },
        {
          id: 4,
          name: "프로그래밍 입문 책",
          price: 12000,
          category: "도서",
          locationName: "광개토관",
          createdAtText: "20분 전",
          imageUrl: "",
          badgeText: "",
          liked: false,
        },
        {
          id: 5,
          name: "세종대 후드티 판매",
          price: 28000,
          category: "의류",
          locationName: "집현관",
          createdAtText: "1시간 전",
          imageUrl: "",
          badgeText: "SEJONG",
          liked: false,
        },
        {
          id: 6,
          name: "데이터베이스 전공책",
          price: 18000,
          category: "도서",
          locationName: "학술정보원",
          createdAtText: "방금 전",
          imageUrl: "",
          badgeText: "",
          liked: false,
        },
        {
          id: 7,
          name: "무선 키보드 상태 좋음",
          price: 25000,
          category: "전자기기",
          locationName: "대양AI센터",
          createdAtText: "5분 전",
          imageUrl: "",
          badgeText: "",
          liked: false,
        },
        {
          id: 8,
          name: "스타벅스 텀블러",
          price: 15000,
          category: "생활용품",
          locationName: "광개토관",
          createdAtText: "20분 전",
          imageUrl: "",
          badgeText: "",
          liked: false,
        },
        {
          id: 9,
          name: "캠퍼스 노트 세트",
          price: 5000,
          category: "기타",
          locationName: "군자관",
          createdAtText: "1시간 전",
          imageUrl: "",
          badgeText: "",
          liked: false,
        },
      ];

      const searchForm = document.getElementById("searchForm");
      const searchInput = document.getElementById("searchInput");
      const listTitle = document.getElementById("listTitle");
      const resultGrid = document.getElementById("resultGrid");
      const resultCount = document.getElementById("resultCount");
      const sortSelect = document.getElementById("sortSelect");

      let currentKeyword = "";
      let currentCategory = "전체";
      let currentMode = "";
      let currentProducts = [];

      document.addEventListener("DOMContentLoaded", () => {
        readUrlParams();
        applyInitialUI();
        loadProducts();
        bindEvents();
      });

      function readUrlParams() {
        const params = new URLSearchParams(location.search);
        currentKeyword = params.get("keyword") || "";
        currentCategory = params.get("category") || "전체";
        currentMode = params.get("mode") || "";
      }

      function applyInitialUI() {
        searchInput.value = currentKeyword;
        updateCategoryChecked(currentCategory);
        updateTopCategoryActive(currentCategory);
        updateListTitle();
      }

      function bindEvents() {
        const productListNavLinks = document.getElementById("productListNavLinks");
        if (productListNavLinks) {
          const navCategories = ["전체", "전자기기", "도서", "의류", "생활용품", "기타"];
          navCategories.forEach((cat) => {
            const a = document.createElement("a");
            a.dataset.category = cat;
            a.textContent = cat;
            a.href = cat === "전체" ? pageUrl("products") : pageUrl("products", { category: cat });
            productListNavLinks.appendChild(a);
          });
        }

        searchForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const keyword = searchInput.value.trim();
          const params = new URLSearchParams();
          if (keyword !== "") params.set("keyword", keyword);
          if (currentCategory !== "전체") params.set("category", currentCategory);
          
          location.href = pageUrl("products") + (params.toString() ? "?" + params.toString() : "");
        });

        const categoryRadios = document.querySelectorAll("input[name='categoryFilter']");
        categoryRadios.forEach((radio) => {
          radio.addEventListener("change", () => {
            const selectedCategory = radio.value;
            const params = new URLSearchParams();
            if (currentKeyword !== "") params.set("keyword", currentKeyword);
            if (selectedCategory !== "전체") params.set("category", selectedCategory);
            
            location.href = pageUrl("products") + (params.toString() ? "?" + params.toString() : "");
          });
        });

        sortSelect.addEventListener("change", () => {
          renderProducts();
        });
      }

      async function loadProducts() {
        renderStateMessage(resultGrid, "상품을 불러오는 중입니다.", "loading");
        resultCount.textContent = "상품 0개";

        try {
          const url = buildApiUrl();
          const fallbackData = buildFallbackData();
          currentProducts = await fetchProducts(url, fallbackData);
          renderProducts();
        } catch (error) {
          console.error(error);
          currentProducts = buildFallbackData();
          if (currentProducts && currentProducts.length > 0) {
            renderProducts();
          } else {
            resultCount.textContent = "상품 0개";
            renderStateMessage(resultGrid, "서버 연결에 실패했거나 상품 목록을 불러오지 못했습니다.", "error");
          }
        }
      }

      function buildApiUrl() {
        const params = new URLSearchParams();
        if (currentKeyword !== "") params.set("keyword", currentKeyword);
        if (currentCategory !== "전체") params.set("category", currentCategory);
        if (currentMode === "latest") params.set("sort", "latest");
        if (currentMode === "recommend") params.set("type", "recommend");
        
        const loginEmail = getNormalizedLoginEmail();
        if (loginEmail) params.set("userEmail", loginEmail);
        
        const queryString = params.toString();
        if (queryString === "") return API_URLS.productList;
        return `${API_URLS.productList}?${queryString}`;
      }

      async function fetchProducts(url, fallbackData) {
        try {
          const response = await fetch(url, {
            method: "GET",
            headers: { Accept: "application/json" },
          });

          if (!response.ok) {
            const message = await readErrorMessage(response);
            throw new Error(message || "상품 목록을 불러오지 못했습니다.");
          }

          const data = await response.json();
          if (Array.isArray(data)) return data;
          if (Array.isArray(data.products)) return data.products;
          if (Array.isArray(data.content)) return data.content;
          if (Array.isArray(data.items)) return data.items;
          
          throw new Error("상품 목록 응답 형식이 올바르지 않습니다.");
        } catch (error) {
          console.warn("백엔드 연결 전이거나 API 오류가 있어 임시 데이터를 표시합니다.", error);
          if (fallbackData) return fallbackData;
          throw error;
        }
      }

      function renderProducts() {
        let products = [...currentProducts];
        if (sortSelect.value === "priceLow") products.sort((a, b) => Number(a.price) - Number(b.price));
        if (sortSelect.value === "priceHigh") products.sort((a, b) => Number(b.price) - Number(a.price));

        resultCount.textContent = `상품 ${products.length}개`;
        resultGrid.innerHTML = "";

        if (products.length === 0) {
          renderStateMessage(resultGrid, getEmptyProductsMessage(), "empty");
          return;
        }

        products.forEach((product) => {
          const card = document.createElement("article");
          const productName = product.productName || product.name || "상품명 없음";
          const productId = product.id || product.productId;
          const saleStatus = getSaleStatus(product);
          const saleStatusText = getSaleStatusText(product);
          const imageBadgeText = getImageBadgeText(product);
          const badgeHtml = imageBadgeText ? `<span class="care">${escapeHtml(imageBadgeText)}</span>` : "";

          card.className = "product-card";
          card.addEventListener("click", () => {
            if (!productId) {
              alert("상품 정보를 확인할 수 없습니다.");
              return;
            }
            location.href = productDetailUrl(productId);
          });

          card.innerHTML = `
            <div class="product-img ${getCategoryColorClass(product.category)}">
              ${badgeHtml}
              ${createProductImageHtml(product)}
              <span class="product-status ${escapeHtml(saleStatus)}">${escapeHtml(saleStatusText)}</span>
              <button class="heart ${product.liked ? "liked" : ""}" type="button" aria-label="찜하기" onclick="event.stopPropagation(); toggleProductLike(this, ${Number(productId)}, ${product.liked ? "true" : "false"})">${product.liked ? "♥" : "♡"}</button>
            </div>
            <div class="product-info">
              <p class="product-name">${escapeHtml(productName)}</p>
              <p class="product-price">${formatPrice(product.price)}</p>
              <div class="product-meta">
                <span>${escapeHtml(product.locationName || "위치 미정")}</span>
                <span>${escapeHtml(product.createdAtText || "")}</span>
              </div>
            </div>
          `;
          
          resultGrid.appendChild(card);
          hydrateRemoteImages(card);
        });
      }

      function renderStateMessage(container, message, type = "empty") {
        container.innerHTML = `
          <div class="empty-message ${escapeHtml(type)}">
            ${escapeHtml(message)}
          </div>
        `;
      }

      function getEmptyProductsMessage() {
        if (hasListFilter()) return "검색어 또는 카테고리 조건에 맞는 상품이 없습니다.";
        if (currentMode === "latest") return "등록된 최신 상품이 없습니다.";
        if (currentMode === "recommend") return "등록된 추천 상품이 없습니다.";
        return "등록된 상품이 없습니다.";
      }

      function hasListFilter() {
        return currentKeyword.trim() !== "" || currentCategory !== "전체";
      }

      function buildFallbackData() {
        let result = [...fallbackProducts];
        if (currentKeyword !== "") {
          const lowerKeyword = currentKeyword.toLowerCase();
          result = result.filter((product) => {
            return (
              product.name.toLowerCase().includes(lowerKeyword) ||
              product.category.toLowerCase().includes(lowerKeyword) ||
              product.locationName.toLowerCase().includes(lowerKeyword)
            );
          });
        }
        if (currentCategory !== "전체") {
          result = result.filter((product) => product.category === currentCategory);
        }
        if (currentMode === "latest") {
          result = result.slice().reverse();
        }
        if (currentMode === "recommend") {
          result = result.sort(() => Math.random() - 0.5);
        }
        return result;
      }

      function updateListTitle() {
        if (currentMode === "latest") {
          listTitle.textContent = "최신상품";
          return;
        }
        if (currentMode === "recommend") {
          listTitle.textContent = "오늘의 추천 아이템";
          return;
        }
        if (currentKeyword !== "" && currentCategory !== "전체") {
          listTitle.textContent = `"${currentKeyword}" 검색 결과 · ${currentCategory}`;
          return;
        }
        if (currentKeyword !== "") {
          listTitle.textContent = `"${currentKeyword}" 검색 결과`;
          return;
        }
        if (currentCategory !== "전체") {
          listTitle.textContent = `${currentCategory} 상품`;
          return;
        }
        listTitle.textContent = "전체 상품";
      }

      function updateCategoryChecked(category) {
        const targetRadio = document.querySelector(`input[name='categoryFilter'][value='${category}']`);
        if (targetRadio) {
          targetRadio.checked = true;
        }
      }

      function updateTopCategoryActive(category) {
        const links = document.querySelectorAll(".nav-left a");
        links.forEach((link) => {
          if (link.dataset.category === category) {
            link.classList.add("active");
          } else {
            link.classList.remove("active");
          }
        });
      }

      function resetFilter() {
        location.href = pageUrl("products");
      }

      function getSaleStatusText(product) {
        if (product.saleStatusText) return product.saleStatusText;
        if (product.status === "sold-out" || product.saleStatus === "SOLD_OUT") return "판매완료";
        return "판매중";
      }

      function getSaleStatus(product) {
        if (product.status) return product.status;
        if (product.saleStatus === "SOLD_OUT") return "sold-out";
        return "on-sale";
      }

      function getImageBadgeText(product) {
        const badgeText = product.badgeText || "";
        if (badgeText === "판매중" || badgeText === "판매완료") return "";
        return badgeText;
      }

      function createProductImageHtml(product) {
        if (product.imageUrl) {
          return ` <img ${imageSourceAttributes(product.imageUrl, product.name || "상품 이미지", "product-real-img")} /> `;
        }
        return getCategoryEmoji(product.category);
      }

      function getCategoryEmoji(category) {
        if (category === "전자기기") return "💻";
        if (category === "도서") return "📘";
        if (category === "의류") return "👕";
        if (category === "생활용품") return "🥤";
        return "📦";
      }

      function getCategoryColorClass(category) {
        if (category === "전자기기") return "blue";
        if (category === "도서") return "green";
        if (category === "의류") return "red";
        if (category === "생활용품") return "pink";
        return "gray";
      }

      function formatPrice(price) {
        const numberPrice = Number(price);
        if (Number.isNaN(numberPrice)) return "가격 미정";
        return numberPrice.toLocaleString("ko-KR") + "원";
      }

      async function toggleProductLike(button, productId, initiallyLiked) {
        const userEmail = getNormalizedLoginEmail();
        if (!userEmail) {
          alert("로그인이 필요합니다.");
          location.href = pageUrl("login");
          return;
        }

        const currentlyLiked = button.classList.contains("liked");
        button.disabled = true;

        try {
          const response = await fetch(
            `${API_BASE_URL}/api/products/${encodeURIComponent(productId)}/likes?userEmail=${encodeURIComponent(userEmail)}`,
            { method: currentlyLiked ? "DELETE" : "POST" },
          );

          if (!response.ok) {
            throw new Error(await readErrorMessage(response));
          }

          const result = await response.json();
          const nextLiked = Boolean(result.liked);
          button.classList.toggle("liked", nextLiked);
          button.textContent = nextLiked ? "♥" : "♡";
          currentProducts = currentProducts.map((product) =>
            Number(product.id) === Number(productId) ? { ...product, liked: nextLiked } : product,
          );
        } catch (error) {
          alert(error.message || "찜하기 처리에 실패했습니다.");
        } finally {
          button.disabled = false;
        }
      }

      function getNormalizedLoginEmail() {
        const loginEmail = getLoginEmail();
        return loginEmail ? toSejongEmail(loginEmail) : "";
      }

      function closeBanner() {
        document.querySelector(".top-banner").style.display = "none";
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
