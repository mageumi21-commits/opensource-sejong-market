<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>세종마켓 메인 페이지</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E">

    <style>
      :root {
        --primary: #d93025;
        --primary-dark: #b71c1c;
        --primary-light: #fdecec;
        --text-primary: #1a1a1a;
        --text-secondary: #555;
        --text-muted: #999;
        --border: #e0e0e0;
        --bg-page: #ffffff;
        --bg-card: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: Arial, "Noto Sans KR", sans-serif;
        background: var(--bg-page);
        color: var(--text-primary);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        border: none;
        background: none;
        cursor: pointer;
        font-family: inherit;
      }

      .top-banner {
        width: 100%;
        height: 48px;
        background: linear-gradient(90deg, var(--primary-dark), var(--primary));
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 700;
        position: relative;
      }

      .top-banner span {
        margin-right: 8px;
      }

      .top-banner .close-btn {
        position: absolute;
        right: 28px;
        top: 50%;
        transform: translateY(-50%);
        color: white;
        font-size: 28px;
        font-weight: 300;
      }

      .header {
        border-bottom: 1px solid #eeeeee;
        background: white;
      }

      .header-inner {
        width: 1180px;
        margin: 0 auto;
        padding: 18px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-img {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        object-fit: cover;
      }

      .logo-text-wrap {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }

      .logo-main {
        font-size: 24px;
        font-weight: 900;
      }

      .logo-sub {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-secondary);
      }

      .search-form {
        width: 520px;
        height: 42px;
        background: #f5f5f5;
        border-radius: 999px;
        display: flex;
        align-items: center;
        padding: 0 8px 0 18px;
        gap: 10px;
      }

      .search-icon {
        font-size: 18px;
        color: #999999;
      }

      .search-form input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-size: 14px;
      }

      .search-submit-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--primary);
        color: white;
        font-size: 18px;
        font-weight: 900;
      }

      .auth-area {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      .auth-user-name {
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 900;
        white-space: nowrap;
      }

      .login-btn,
      .auth-login-btn,
      .auth-action-btn {
        border: 1px solid var(--primary);
        padding: 13px 25px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 800;
        background: var(--primary);
        color: white;
        transition: 0.18s;
      }

      .auth-action-btn {
        padding: 12px 16px;
      }

      .auth-logout-btn {
        border-color: #d5d5d5;
        background: #ffffff;
        color: var(--text-primary);
      }

      .login-btn:hover,
      .auth-login-btn:hover,
      .auth-action-btn:hover {
        background: var(--primary-dark);
      }

      .auth-logout-btn:hover {
        border-color: var(--primary);
        background: var(--primary-light);
        color: var(--primary);
      }

      .nav {
        width: 1180px;
        height: 70px;
        margin: 0 auto;
        display: flex;
        align-items: center;
      }

      .nav-left {
        display: flex;
        align-items: center;
        gap: 34px;
      }

      .nav-left a {
        font-size: 17px;
        font-weight: 800;
        transition: 0.18s;
      }

      .nav-left a:hover {
        color: var(--primary);
      }

      .main {
        width: 1180px;
        margin: 22px auto 80px;
        position: relative;
      }

      .hero {
        width: 100%;
        min-height: 290px;
        background:
          radial-gradient(circle at 84% 22%, rgba(217, 48, 37, 0.16), transparent 28%),
          linear-gradient(135deg, #ffffff 0%, var(--primary-light) 100%);
        border: 1px solid rgba(217, 48, 37, 0.13);
        border-radius: 24px;
        padding: 48px 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        overflow: hidden;
        position: relative;
        box-shadow: 0 8px 28px rgba(217, 48, 37, 0.08);
      }

      .hero::before {
        content: "";
        position: absolute;
        width: 260px;
        height: 260px;
        right: -80px;
        top: -90px;
        background: rgba(217, 48, 37, 0.08);
        border-radius: 50%;
      }

      .hero::after {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        right: 250px;
        bottom: -90px;
        background: rgba(217, 48, 37, 0.06);
        border-radius: 50%;
      }

      .hero-text {
        position: relative;
        z-index: 2;
      }

      .hero-label {
        display: inline-block;
        margin-bottom: 14px;
        padding: 6px 13px;
        border-radius: 999px;
        background: white;
        color: var(--primary);
        border: 1px solid rgba(217, 48, 37, 0.18);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }

      .hero-text h1 {
        font-size: 42px;
        line-height: 1.28;
        letter-spacing: -1.5px;
        margin-bottom: 18px;
      }

      .hero-text h1 strong {
        color: var(--primary);
      }

      .hero-desc {
        font-size: 18px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 30px;
      }

      .hero-desc .red {
        color: var(--primary);
        font-weight: 900;
      }

      .hero-btn {
        min-width: 170px;
        height: 54px;
        padding: 0 28px;
        border-radius: 999px;
        background: var(--primary);
        color: white;
        font-size: 17px;
        font-weight: 800;
        box-shadow: 0 8px 18px rgba(217, 48, 37, 0.25);
        transition: 0.18s;
      }

      .hero-btn:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
      }

      .hero-btn span {
        margin-left: 8px;
        font-size: 22px;
      }

      .hero-logo-box {
        width: 260px;
        height: 260px;
        border-radius: 42px;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 2;
        box-shadow: 0 12px 30px rgba(217, 48, 37, 0.18);
      }

      .hero-logo-img {
        width: 190px;
        height: 190px;
        object-fit: contain;
      }

      .quick-menu {
        margin: 46px auto 58px;
        display: flex;
        justify-content: center;
        gap: 34px;
      }

      .quick-item {
        width: 110px;
        text-align: center;
      }

      .quick-link {
        display: block;
      }

      .quick-icon {
        width: 88px;
        height: 88px;
        margin: 0 auto 12px;
        background: #f8f8f8;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        transition: 0.2s;
      }

      .quick-link:hover .quick-icon {
        transform: translateY(-4px);
        background: var(--primary-light);
        color: var(--primary);
      }

      .quick-item p {
        font-size: 14px;
        font-weight: 800;
        color: #333333;
      }

      .product-section {
        margin-top: 58px;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .section-title {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -1px;
      }

      .more-btn {
        padding: 11px 20px;
        border: 1px solid #bbbbbb;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 800;
        color: #333333;
        background: white;
        transition: 0.18s;
      }

      .more-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: var(--primary-light);
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 18px;
      }

      .product-card {
        border-radius: 10px;
        overflow: hidden;
        background: white;
        border: 1px solid #eeeeee;
        transition: 0.2s;
        position: relative;
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .product-img {
        height: 190px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        background: #f1f1f1;
      }

      .product-img.blue {
        background: linear-gradient(135deg, #d8ecff, #ffffff);
      }

      .product-img.gray {
        background: linear-gradient(135deg, #dddddd, #f9f9f9);
      }

      .product-img.beige {
        background: linear-gradient(135deg, #d8c7a7, #f5f0e5);
      }

      .product-img.red {
        background: linear-gradient(135deg, var(--primary-light), #ffffff);
      }

      .product-img.green {
        background: linear-gradient(135deg, #e6f8df, #ffffff);
      }

      .product-img.pink {
        background: linear-gradient(135deg, #fff0f3, #ffffff);
      }

      .product-real-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .heart {
        position: absolute;
        right: 12px;
        top: 10px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.86);
        color: white;
        font-size: 27px;
        text-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
        z-index: 5;
        display: grid;
        place-items: center;
        line-height: 1;
      }

      .heart.liked {
        color: var(--primary);
        text-shadow: none;
      }

      .care {
        position: absolute;
        left: 10px;
        top: 10px;
        background: var(--primary);
        color: white;
        padding: 4px 8px;
        border-radius: 3px;
        font-size: 12px;
        font-weight: 900;
        z-index: 5;
      }

      .product-info {
        padding: 13px;
      }

      .product-name {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 9px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .product-status {
        position: absolute;
        left: 10px;
        bottom: 10px;
        z-index: 6;
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 900;
      }

      .product-status.on-sale {
        background: var(--primary);
        color: #fff;
      }

      .product-status.sold-out {
        background: #888;
        color: #fff;
      }

      .product-price {
        font-size: 18px;
        font-weight: 900;
        margin-bottom: 8px;
      }

      .product-meta {
        font-size: 12px;
        color: #777777;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      .empty-message {
        grid-column: 1 / -1;
        padding: 50px 20px;
        text-align: center;
        border: 1px dashed #dddddd;
        border-radius: 12px;
        color: #777777;
        font-size: 15px;
        font-weight: 700;
        background: #fafafa;
      }

      .empty-message.loading {
        color: #777777;
      }

      .empty-message.error {
        color: var(--primary);
        background: #fff5f5;
        border-color: #ffd6d6;
      }

      @media (max-width: 1280px) {
        .header-inner,
        .nav,
        .main {
          width: 95%;
        }
      }

      @media (max-width: 900px) {
        .header-inner {
          flex-wrap: wrap;
          gap: 15px;
        }

        .search-form {
          order: 3;
          width: 100%;
        }

        .nav {
          height: auto;
          padding: 18px 0;
          overflow-x: auto;
        }

        .nav-left {
          gap: 22px;
          white-space: nowrap;
        }

        .hero {
          padding: 38px 28px;
          flex-direction: column;
          text-align: center;
          gap: 30px;
        }

        .hero-text h1 {
          font-size: 32px;
        }

        .hero-desc {
          font-size: 16px;
        }

        .hero-logo-box {
          width: 200px;
          height: 200px;
        }

        .hero-logo-img {
          width: 145px;
          height: 145px;
        }

        .product-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .quick-menu {
          flex-wrap: wrap;
        }
      }

      @media (max-width: 520px) {
        .product-grid {
          grid-template-columns: 1fr;
        }

        .hero-text h1 {
          font-size: 26px;
        }

        .hero {
          padding: 32px 22px;
        }

        .section-title {
          font-size: 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="top-banner">
      <span>🏫</span>
      세종대학교 학생들을 위한 안전한 중고거래 플랫폼, 세종마켓!
      <button class="close-btn" onclick="closeBanner()">×</button>
    </div>

    <header class="header">
      <div class="header-inner">
        <a href="index.html" class="logo">
          <img src="../login_mypage/logo.png" alt="세종마켓 로고" class="logo-img" />
          <div class="logo-text-wrap">
            <span class="logo-main">세종마켓</span>
            <span class="logo-sub">세종대학교 중고거래</span>
          </div>
        </a>

        <form class="search-form" id="searchForm">
          <span class="search-icon">⌕</span>
          <input id="searchInput" type="text" placeholder="상품명을 검색해주세요" />
          <button type="submit" class="search-submit-btn">›</button>
        </form>

        <div class="auth-area" id="authArea">
          <button class="login-btn" type="button" onclick="location.href='../login_mypage/login.html'">
            로그인/회원가입
          </button>
        </div>
      </div>

      <nav class="nav">
        <div class="nav-left" id="navLinks">
          <a href="product-list.html">전체</a>
          <a href="product-list.html?category=전자기기">전자기기</a>
          <a href="product-list.html?category=도서">도서</a>
          <a href="product-list.html?category=의류">의류</a>
          <a href="product-list.html?category=생활용품">생활용품</a>
          <a href="product-list.html?category=기타">기타</a>
        </div>
      </nav>
    </header>

    <main class="main">
      <section class="hero">
        <div class="hero-text">
          <p class="hero-label">SEJONG MARKET</p>
          <h1>
            세종대 중고거래 사이트에<br />
            <strong>오신 것을 환영합니다</strong>
          </h1>
          <p class="hero-desc">
            학생들을 위한 <span class="red">안전하고 편리한</span> 교내 중고거래
          </p>
          <button class="hero-btn" onclick="goProductCreate()">
            상품 등록하기 <span>›</span>
          </button>
        </div>

        <div class="hero-logo-box">
          <img src="../login_mypage/logo.png" alt="세종마켓 로고" class="hero-logo-img" />
        </div>
      </section>

      <section class="quick-menu" id="quickMenu">
        <div class="quick-item">
          <a href="../login_mypage/mypage.html?view=likes" class="quick-link" id="quickRecommendLink">
            <div class="quick-icon">♥</div>
            <p>찜</p>
          </a>
        </div>

        <div class="quick-item">
          <a href="../login_mypage/mypage.html" class="quick-link" id="quickMypageLink">
            <div class="quick-icon">👤</div>
            <p>마이페이지</p>
          </a>
        </div>

        <div class="quick-item">
          <a href="product-list.html?mode=latest" class="quick-link" id="quickLatestLink">
            <div class="quick-icon">🛍️</div>
            <p>최신상품</p>
          </a>
        </div>

        <div class="quick-item">
<a href="../product_create_ui/product-create-ui.html" class="quick-link" id="quickRegisterLink" onclick="return goProductCreate(event)">
            <div class="quick-icon">＋</div>
            <p>상품등록</p>
          </a>
        </div>
      </section>

      <section class="product-section">
        <div class="section-head">
          <h2 class="section-title">오늘의 추천 아이템</h2>
          <a href="product-list.html?mode=recommend" class="more-btn">더 보기</a>
        </div>

        <div class="product-grid" id="recommendGrid">
          <div class="empty-message">추천 상품을 불러오는 중입니다.</div>
        </div>
      </section>

      <section class="product-section" id="latestProducts">
        <div class="section-head">
          <h2 class="section-title">최신상품</h2>
          <a href="product-list.html?mode=latest" class="more-btn">더 보기</a>
        </div>

        <div class="product-grid" id="latestGrid">
          <div class="empty-message">최신 상품을 불러오는 중입니다.</div>
        </div>
      </section>
    </main>

    <script src="../common/api-config.js"></script>
    <script src="../common/app-utils.js"></script>
    <script>
      window.SejongMarketUtils.renderAuthArea("authArea", {
        loginUrl: window.SejongMarketUtils.pageUrl('login'),
        signupUrl: window.SejongMarketUtils.pageUrl('login'),
        mypageUrl: window.SejongMarketUtils.pageUrl('mypage'),
        afterLogoutUrl: window.SejongMarketUtils.pageUrl('home')
      });

      const {
        API_BASE_URL,
        getLoginEmail,
        toSejongEmail,
        readErrorMessage,
        imageSourceAttributes,
        hydrateRemoteImages,
        pageUrl,
        productDetailUrl
      } = window.SejongMarketUtils;

      // 배포/로컬 환경에 맞게 링크 동적 설정
      (function initLinks() {
        const heroBtn = document.querySelector('.hero-btn');
        if (heroBtn) heroBtn.onclick = () => { location.href = pageUrl('productNew'); };

        const quickRecommend = document.getElementById('quickRecommendLink');
        if (quickRecommend) quickRecommend.href = pageUrl('mypage', { view: 'likes' });

        const quickMypage = document.getElementById('quickMypageLink');
        if (quickMypage) quickMypage.href = pageUrl('mypage');

        const quickLatest = document.getElementById('quickLatestLink');
        if (quickLatest) quickLatest.href = pageUrl('products', { mode: 'latest' });

        const quickRegister = document.getElementById('quickRegisterLink');
        if (quickRegister) quickRegister.href = pageUrl('productNew');

        const moreRecommendBtn = document.querySelector('a.more-btn[href*="mode=recommend"]');
        if (moreRecommendBtn) moreRecommendBtn.href = pageUrl('products', { mode: 'recommend' });

        const moreLatestBtn = document.querySelector('a.more-btn[href*="mode=latest"]');
        if (moreLatestBtn) moreLatestBtn.href = pageUrl('products', { mode: 'latest' });

        // 네비게이션 카테고리 링크
        const navLinks = document.getElementById('navLinks');
        if (navLinks) {
          const categories = ['전체', '전자기기', '도서', '의류', '생활용품', '기타'];
          const links = navLinks.querySelectorAll('a');
          links.forEach((link, i) => {
            const cat = categories[i];
            if (!cat) return;
            link.href = cat === '전체'
              ? pageUrl('products')
              : pageUrl('products', { category: cat });
          });
        }
      })();
      const API_URLS = {
        recommendProducts: `${API_BASE_URL}/api/products/recommendations?limit=5`,
        latestProducts: `${API_BASE_URL}/api/products/latest?limit=5`,
        imageBaseUrl: API_BASE_URL
      };

      const searchForm = document.getElementById("searchForm");
      const searchInput = document.getElementById("searchInput");
      const recommendGrid = document.getElementById("recommendGrid");
      const latestGrid = document.getElementById("latestGrid");

      document.addEventListener("DOMContentLoaded", () => {
        loadMainProducts();
      });

      searchForm.addEventListener("submit", event => {
        event.preventDefault();

        const keyword = searchInput.value.trim();

        if (keyword === "") {
          location.href = pageUrl('products');
          return;
        }

        location.href = pageUrl('products', { keyword });
      });

      async function loadMainProducts() {
        await Promise.all([
          loadProductSection(
            recommendGrid,
            API_URLS.recommendProducts,
            "추천 상품을 불러오는 중입니다.",
            "등록된 추천 상품이 없습니다.",
            "추천 상품을 불러오지 못했습니다. 서버 연결 상태를 확인해주세요."
          ),
          loadProductSection(
            latestGrid,
            API_URLS.latestProducts,
            "최신 상품을 불러오는 중입니다.",
            "등록된 최신 상품이 없습니다.",
            "최신 상품을 불러오지 못했습니다. 서버 연결 상태를 확인해주세요."
          )
        ]);
      }

      async function loadProductSection(container, url, loadingMessage, emptyMessage, errorMessage) {
        renderStateMessage(container, loadingMessage, "loading");

        try {
          const products = await fetchProducts(withLoginEmail(url));

          if (!products || products.length === 0) {
            renderStateMessage(container, emptyMessage, "empty");
            return;
          }

          renderProductCards(container, products);
        } catch (error) {
          console.error(error);
          renderStateMessage(container, errorMessage, "error");
        }
      }

      async function fetchProducts(url) {
        const response = await fetch(url, {
          method: "GET",
          headers: {
            Accept: "application/json"
          }
        });

        if (!response.ok) {
          const message = await readErrorMessage(response);
          throw new Error(message || "상품 목록을 불러오지 못했습니다.");
        }

        const data = await response.json();

        if (Array.isArray(data)) {
          return data;
        }

        if (Array.isArray(data.products)) {
          return data.products;
        }

        if (Array.isArray(data.content)) {
          return data.content;
        }

        if (Array.isArray(data.items)) {
          return data.items;
        }

        throw new Error("상품 목록 응답 형식이 올바르지 않습니다.");
      }

      function renderProductCards(container, products) {
        container.innerHTML = "";

        products.forEach(product => {
          const card = document.createElement("article");
          const imageHtml = createProductImageHtml(product);
          const productName = product.productName || product.name || "상품명 없음";
          const productId = product.id || product.productId;
          const saleStatus = getSaleStatus(product);
          const saleStatusText = getSaleStatusText(product);
          const imageBadgeText = getImageBadgeText(product);
          const badgeHtml = imageBadgeText
            ? `<span class="care">${escapeHtml(imageBadgeText)}</span>`
            : "";

          card.className = "product-card";

          card.addEventListener("click", () => {
if (!productId) {
  alert("상품 정보를 확인할 수 없습니다.");
  return;
}
location.href = productDetailUrl(productId);
          });

          card.innerHTML = `
            <div class="product-img ${getCategoryColorClass(product.category)}">
              ${badgeHtml}
              ${imageHtml}
              <span class="product-status ${escapeHtml(saleStatus)}">${escapeHtml(saleStatusText)}</span>
              <button class="heart ${product.liked ? "liked" : ""}" type="button" aria-label="찜하기" onclick="event.stopPropagation(); toggleProductLike(this, ${Number(productId)})">${product.liked ? "♥" : "♡"}</button>
            </div>

            <div class="product-info">
              <p class="product-name">${escapeHtml(productName)}</p>
              <p class="product-price">${formatPrice(product.price)}</p>
              <div class="product-meta">
                <span>${escapeHtml(product.locationName || "위치 미정")}</span>
                <span>${escapeHtml(product.createdAtText || "")}</span>
              </div>
            </div>
          `;

          container.appendChild(card);
          hydrateRemoteImages(card);
        });
      }

      function renderStateMessage(container, message, type = "empty") {
        container.innerHTML = `
          <div class="empty-message ${escapeHtml(type)}">
            ${escapeHtml(message)}
          </div>
        `;
      }

      function goProductCreate(event) {
        if (event) {
          event.preventDefault();
        }

        const loginEmail = getNormalizedLoginEmail();
        const loginUser = localStorage.getItem("loginUser") || "";

        if (!loginEmail && !loginUser) {
          alert("상품 등록은 로그인 후 이용할 수 있습니다.");
          location.href = "../login_mypage/login.html";
          return false;
        }

        location.href = "../product_create_ui/product-create-ui.html";
        return false;
      }

      function createProductImageHtml(product) {
        if (product.imageUrl) {
          return `
            <img ${imageSourceAttributes(product.imageUrl, product.name || "상품 이미지", "product-real-img")} />
          `;
        }

        return getCategoryEmoji(product.category);
      }

      function getCategoryEmoji(category) {
        if (category === "전자기기") return "💻";
        if (category === "도서") return "📘";
        if (category === "의류") return "👕";
        if (category === "생활용품") return "🥤";
        return "📦";
      }

      function getCategoryColorClass(category) {
        if (category === "전자기기") return "blue";
        if (category === "도서") return "green";
        if (category === "의류") return "red";
        if (category === "생활용품") return "pink";
        return "gray";
      }

      function formatPrice(price) {
        const numberPrice = Number(price);

        if (Number.isNaN(numberPrice)) {
          return "가격 미정";
        }

        return numberPrice.toLocaleString("ko-KR") + "원";
      }

      function withLoginEmail(url) {
        const userEmail = getNormalizedLoginEmail();
        if (!userEmail) {
          return url;
        }

        const separator = url.includes("?") ? "&" : "?";
        return `${url}${separator}userEmail=${encodeURIComponent(userEmail)}`;
      }

      function getNormalizedLoginEmail() {
        const loginEmail = getLoginEmail();
        return loginEmail ? toSejongEmail(loginEmail) : "";
      }

      async function toggleProductLike(button, productId) {
        const userEmail = getNormalizedLoginEmail();
        if (!userEmail) {
          alert("로그인이 필요합니다.");
          location.href = pageUrl('login');
          return;
        }

        const currentlyLiked = button.classList.contains("liked");
        button.disabled = true;

        try {
          const response = await fetch(
            `${API_BASE_URL}/api/products/${encodeURIComponent(productId)}/likes?userEmail=${encodeURIComponent(userEmail)}`,
            { method: currentlyLiked ? "DELETE" : "POST" }
          );

          if (!response.ok) {
            throw new Error(await readErrorMessage(response));
          }

          const result = await response.json();
          const nextLiked = Boolean(result.liked);
          button.classList.toggle("liked", nextLiked);
          button.textContent = nextLiked ? "♥" : "♡";
        } catch (error) {
          alert(error.message || "찜하기 처리에 실패했습니다.");
        } finally {
          button.disabled = false;
        }
      }

      function closeBanner() {
        document.querySelector(".top-banner").style.display = "none";
      }

      function getSaleStatusText(product) {
        if (product.saleStatusText) {
          return product.saleStatusText;
        }

        if (product.status === "sold-out" || product.saleStatus === "SOLD_OUT") {
          return "판매완료";
        }

        return "판매중";
      }

      function getSaleStatus(product) {
        if (product.status) {
          return product.status;
        }

        if (product.saleStatus === "SOLD_OUT") {
          return "sold-out";
        }

        return "on-sale";
      }

      function getImageBadgeText(product) {
        const badgeText = product.badgeText || "";
        if (badgeText === "판매중" || badgeText === "판매완료") {
          return "";
        }

        return badgeText;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
